    .btn {
      font-family: 'Chillax', sans-serif;
      color: white;
      font-size: 16px;
      font-weight: 900;
      font-style: italic;
      text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.55);
      border: 2px solid #fff;
      border-radius: 18px;
      min-width: 180px;
      height: 42px;
      cursor: pointer;
      background: linear-gradient(
        to bottom,
        #8d8d8d 0%,
        #d8d8d8 42%,
        #555555 52%,
        #9f9f9f 100%
      );
      box-shadow:
        0 2px #7c7c7c,
        0 5px 10px rgba(0, 0, 0, 0.22);
      transition: background 0.3s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    .btn:hover,
    .activo,
    .btn-buscar {
      background:
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.85) 0%,
          rgba(255, 255, 255, 0.25) 48%,
          rgba(255, 255, 255, 0) 52%
        ),
        linear-gradient(
          to bottom,
          #10f0ee 0%,
          #09c8d8 40%,
          #078dad 62%,
          #02ccdc 100%
        );
        position: relative;
    overflow: hidden;
   
    }
 
    .btn-buscar::before{
        content: "";
        top: 0;
        left: -80%;
        width: 65%;
        
        position: absolute;
        
       
        height: 100%;
        background: linear-gradient(
    120deg,
    transparent,
    rgba(255, 255, 255, 0.85),
    transparent
  );
  transform: skewX(-25deg);
  pointer-events: none;
    }

    .btn-buscar:hover::before  {
       animation: flashBtn 0.8s ease;
       
    }
@keyframes flashBtn {
  from {
    left: -80%;
  }

  to {
    left: 130%;
  }

.intro-logo {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  overflow: hidden;
  animation: introSalir 0.7s ease forwards;
  animation-delay: 3s;
}

.intro-icon {
  position: absolute;
  width: 150px;
  animation: giroIcono 2.1s ease-in-out forwards;
}

.intro-full {
  width: min(620px, 80vw);
  opacity: 0;
  transform: scale(0.92);
  animation: apareceLogo 1s ease forwards;
  animation-delay: 1.7s;
}

@keyframes giroIcono {
  0% {
    opacity: 1;
    transform: rotate(0deg) scale(1.1);
  }

  45% {
    opacity: 1;
    transform: rotate(180deg) scale(1);
  }

  70% {
    opacity: 1;
    transform: translateX(-220px) rotate(180deg) scale(0.55);
  }

  100% {
    opacity: 0;
    transform: translateX(-260px) rotate(180deg) scale(0.35);
  }
}

@keyframes apareceLogo {
  0% {
    opacity: 0;
    transform: scale(0.92);
  }

  100% {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes introSalir {
  to {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
}
.filtro-todo.animar-cambio{
    animation: cambioFiltro 0.35s ease;
}
@keyframes cambioFiltro {
    0%{
       opacity: 0;
       transform: translateY(12px) scale(0.98);
    }
    100%{
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

  <script>
    const API_URL = "http://localhost:3000";

    let captchaActual = "";
    let modoBusqueda = "documento";
    let documentosOriginales = [];
    let paginaActual = 1;
const registrosPorPagina = 15;
let documentosFiltrados = [];
    let documentosCargados = false;

    function generarCaptcha() {
      const letras = "ABCDEFGHJKLMNPQRSTUVWXYZ";
      captchaActual = "";

      for (let i = 0; i < 5; i++) {
        captchaActual += letras[Math.floor(Math.random() * letras.length)];
      }

      document.getElementById("captchaCode").textContent =
        captchaActual.split("").join(" ");
    }

    function validarCaptcha() {
      const valor = document.getElementById("captchaInput").value.trim().toUpperCase();

      if (valor !== captchaActual) {
        alert("Captcha incorrecto");
        generarCaptcha();
        document.getElementById("captchaInput").value = "";
        return false;
      }

      return true;
    }

    function cambiarModoBusqueda(modo) {
      modoBusqueda = modo;

      document.getElementById("btnDocumento").classList.remove("activo");
      document.getElementById("btnCliente").classList.remove("activo");

      const tituloFiltro = document.getElementById("tituloFiltro");

      if (modo === "documento") {
        tituloFiltro.textContent = "N° Documento";

        document.getElementById("btnDocumento").classList.add("activo");
        document.getElementById("grupoTipo").style.display = "grid";
        document.getElementById("grupoSerie").style.display = "grid";
        document.getElementById("grupoMonto").style.display = "grid";
        document.getElementById("grupoCliente").style.display = "none";
         document.getElementById("grupoFecha").style.display = "grid";
      document.getElementById("grupoFechaDesde").style.display = "none";
document.getElementById("grupoFechaHasta").style.display = "none";

        
      } else {
        tituloFiltro.textContent = "RUC / DNI";

        document.getElementById("btnCliente").classList.add("activo");
        document.getElementById("grupoTipo").style.display = "none";
        document.getElementById("grupoSerie").style.display = "none";
        document.getElementById("grupoMonto").style.display = "none";
        document.getElementById("grupoCliente").style.display = "grid";
         document.getElementById("grupoFecha").style.display = "none";
       document.getElementById("grupoFechaDesde").style.display = "block";
  document.getElementById("grupoFechaHasta").style.display = "block";
        }
animarCambioFiltro();
      limpiarFiltros();
    }

    async function cargarDocumentos() {
      const tbody = document.getElementById("tablaDocumentos");
      const estado = document.getElementById("estado");

      try {
        estado.textContent = "Cargando documentos...";
        tbody.innerHTML = `
          <tr>
            <td colspan="6">Cargando documentos...</td>
          </tr>
        `;

        const response = await fetch(`${API_URL}/documentos`);

        if (!response.ok) {
          throw new Error("No se pudo conectar con el servidor");
        }

        const documentos = await response.json();
        documentosOriginales = Array.isArray(documentos) ? documentos : [];
        estado.textContent = "";

        return true;
      } catch (error) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6">Error cargando documentos</td>
          </tr>
        `;
        estado.textContent = "Error cargando documentos.";
        console.error(error);

        return false;
      }
    }

    async function aplicarFiltros() {
      if (!validarCaptcha()) return;

      document.getElementById("resultados").style.display = "block";

      if (!documentosCargados) {
        const ok = await cargarDocumentos();

        if (!ok) return;

        documentosCargados = true;
      }

      if (modoBusqueda === "documento") {
        buscarPorDocumento();
      } else {
        buscarPorCliente();
      }
      document.getElementById("resultados").scrollIntoView({
  behavior: "smooth",
  block: "start"
});
    }
   
    function buscarPorDocumento() {
      limpiarErrores();

      const tipo = document.getElementById("filtroTipo").value.trim();
      const serie = document.getElementById("filtroSerie").value.trim();
      const numero = document.getElementById("filtroNumero").value.trim();
      const inputMonto = document.getElementById("filtroMonto");
      const monto = normalizarMontoInput(inputMonto.value);
const fechaEmision = document
  .getElementById("filtroFechaEmision")
  .value;
      inputMonto.value = monto;

      let errores = [];

      if (!tipo) {
        errores.push("Tipo de documento");
        document.getElementById("filtroTipo").classList.add("error-campo");
      }

      if (!serie) {
        errores.push("Serie");
        document.getElementById("filtroSerie").classList.add("error-campo");
      }

      if (!numero) {
        errores.push("Número");
        document.getElementById("filtroNumero").classList.add("error-campo");
      }

      if (!monto) {
        errores.push("Monto");
        document.getElementById("filtroMonto").classList.add("error-campo");
      }
      if (!fechaEmision) {
  errores.push("Fecha de emisión");
  document
    .getElementById("filtroFechaEmision")
    .classList.add("error-campo");
}

      if (errores.length > 0) {
        alert("Debe completar:\n\n- " + errores.join("\n- "));
        ocultarResultadosVacios();
        return;
      }

      const filtrados = documentosOriginales.filter((doc) => {
        const docTipo = (doc.tipo_documento || "").toLowerCase();
        const docSerie = (doc.serie || "").toLowerCase();
        const docNumero = (doc.correlativo || "").toLowerCase();
        const docMonto = String(doc.monto || "").replace(",", ".");
const docFecha = String(doc.fecha_emision || "")
  .substring(0, 10);
        return (
          docTipo.includes(tipo.toLowerCase()) &&
          docSerie === serie.toLowerCase() &&
          docNumero === numero.toLowerCase() &&
          Number(docMonto) === Number(monto)&& docFecha === fechaEmision
        );
      });
paginaActual = 1;
      renderizarTabla(filtrados);

      document.getElementById("estado").textContent =
        `Resultados encontrados: ${filtrados.length}`;
    }

  function buscarPorCliente() {
  const cliente = document.getElementById("filtroCliente").value.trim();
  const fechaDesde = document.getElementById("filtroFechaDesde").value;
  const fechaHasta = document.getElementById("filtroFechaHasta").value;

  if (!cliente) {
    alert("Debe ingresar el DNI o RUC del cliente.");
    document.getElementById("filtroCliente").classList.add("error-campo");
    return;
  }

  const filtrados = documentosOriginales.filter((doc) => {
    const rucCliente = String(doc.ruc_cliente || "").trim();
    const dniCliente = String(doc.dni_cliente || "").trim();

    const coincideCliente =
      rucCliente === cliente || dniCliente === cliente;

    const docFecha = String(doc.fecha_emision || "").substring(0, 10);

    let coincideFecha = true;

    if (fechaDesde && docFecha < fechaDesde) {
      coincideFecha = false;
    }

    if (fechaHasta && docFecha > fechaHasta) {
      coincideFecha = false;
    }

    return coincideCliente && coincideFecha;
  });
paginaActual = 1;
  renderizarTabla(filtrados);

  document.getElementById("estado").textContent =
    `Resultados encontrados : ${filtrados.length}`;
}

  function renderizarTabla(documentos) {

  documentosFiltrados = documentos;

  const tbody = document.getElementById("tablaDocumentos");
  tbody.innerHTML = "";

  if (!Array.isArray(documentos) || documentos.length === 0) {

    tbody.innerHTML = `
      <tr>
        <td colspan="5">
          No se encontraron documentos
        </td>
      </tr>
    `;

    document.getElementById("paginacion").innerHTML = "";
    return;
  }

  const inicio = (paginaActual - 1) * registrosPorPagina;
  const fin = inicio + registrosPorPagina;

  const documentosPagina =
    documentos.slice(inicio, fin);

  documentosPagina.forEach((doc) => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td class="col-serie">
        ${doc.serie || "-"}
      </td>

      <td class="col-documento">
        ${doc.serie && doc.correlativo
          ? `${doc.serie}-${doc.correlativo}`
          : doc.numero || "-"}
      </td>

      <td>${doc.monto || "-"}</td>

      <td>
        ${formatearFecha(doc.fecha_emision)}
      </td>

      <td>
        <div class="acciones">
          <button
            class="btn-verde"
            onclick="verPdf(${doc.id})">
            VER
          </button>
        </div>
      </td>
    `;

    tbody.appendChild(tr);

  });

  renderizarPaginacion();
}
function renderizarPaginacion() {

  const totalPaginas =
    Math.ceil(
      documentosFiltrados.length /
      registrosPorPagina
    );

  let html = "";

  if (totalPaginas <= 1) {
    document.getElementById("paginacion").innerHTML = "";
    return;
  }

  html += `
    <button
      onclick="cambiarPagina(${paginaActual - 1})"
      ${paginaActual === 1 ? "disabled" : ""}
    >
      ◀
    </button>
  `;

  for (let i = 1; i <= totalPaginas; i++) {

    html += `
      <button
        class="${i === paginaActual ? "pagina-activa" : ""}"
        onclick="cambiarPagina(${i})"
      >
        ${i}
      </button>
    `;
  }

  html += `
    <button
      onclick="cambiarPagina(${paginaActual + 1})"
      ${paginaActual === totalPaginas ? "disabled" : ""}
    >
      ▶
    </button>
  `;

  document.getElementById("paginacion").innerHTML =
    html;
}
function cambiarPagina(pagina) {

  const totalPaginas =
    Math.ceil(
      documentosFiltrados.length /
      registrosPorPagina
    );

  if (pagina < 1 || pagina > totalPaginas) {
    return;
  }

  paginaActual = pagina;

  renderizarTabla(documentosFiltrados);
}
    function limpiarFiltros() {
      const campos = [
        "filtroTipo",
        "filtroSerie",
        "filtroNumero",
        "filtroMonto",
        "filtroCliente",
        "captchaInput"
      ];

      campos.forEach((id) => {
        const campo = document.getElementById(id);
        if (campo) campo.value = "";
      });

      limpiarErrores();

      const resultados = document.getElementById("resultados");
      if (resultados) resultados.style.display = "none";

      const tabla = document.getElementById("tablaDocumentos");
      if (tabla) tabla.innerHTML = "";

      const estado = document.getElementById("estado");
      if (estado) estado.textContent = "";
      const fechaDesde = document.getElementById("filtroFechaDesde");
if (fechaDesde) fechaDesde.value = "";

const fechaHasta = document.getElementById("filtroFechaHasta");
if (fechaHasta) fechaHasta.value = "";
      cerrarModalPdf();

      generarCaptcha();
    }

    function limpiarErrores() {
      document
        .querySelectorAll("input, select")
        .forEach((campo) => campo.classList.remove("error-campo"));
    }

    function ocultarResultadosVacios() {
      document.getElementById("tablaDocumentos").innerHTML = "";
      document.getElementById("estado").textContent = "";
    }

function verPdf(id) {
  const doc = documentosOriginales.find((d) => Number(d.id) === Number(id));

  const modal = document.getElementById("modalPdf");
  const visor = document.getElementById("visorPdfModal");
  const btnPdf = document.getElementById("btnDescargarPdf");
  const btnXml = document.getElementById("btnDescargarXml");

  if (!modal || !visor) {
    alert("No se encontró el visor PDF.");
    return;
  }

  visor.src = `${API_URL}/documentos/${id}/pdf?t=${Date.now()}`;

  if (btnPdf) {
    btnPdf.onclick = function () {
      descargarPdf(id);
    };
  }

  if (btnXml) {
    if (doc && doc.archivo_xml) {
      btnXml.style.display = "inline-block";
      btnXml.onclick = function () {
        descargarXml(id);
      };
    } else {
      btnXml.style.display = "none";
      btnXml.onclick = null;
    }
  }

  modal.style.display = "block";
}

function cerrarModalPdf() {
  const modal = document.getElementById("modalPdf");
  const visor = document.getElementById("visorPdfModal");

  if (modal) modal.style.display = "none";
  if (visor) visor.src = "";
}
    function descargarPdf(id) {
      window.open(`${API_URL}/documentos/${id}/descargar`, "_blank");
    }

    function descargarXml(id) {
      window.open(`${API_URL}/documentos/${id}/xml`, "_blank");
    }

    function normalizarMontoInput(valor) {
      if (!valor) return "";

      let limpio = valor
        .trim()
        .replace(/\s/g, "")
        .replace(",", ".");

      const numero = Number(limpio);

      if (isNaN(numero)) {
        return "";
      }

      return numero.toFixed(2);
    }

    function formatearFecha(fecha) {
      if (!fecha) return "-";

      const soloFecha = String(fecha).split("T")[0];
      const partes = soloFecha.split("-");

      if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
      }

      return soloFecha;
    }

    generarCaptcha();
  
  setTimeout(() => {
  const intro = document.getElementById("introLogo");

  if (intro) {
    intro.remove();
  }
}, 3800);

document.addEventListener("keydown", function (event) {
  if (event.key === "Escape") {
    cerrarModalPdf();
  }
});

window.addEventListener("click", function (event) {
  const modal = document.getElementById("modalPdf");
  if (event.target === modal) {
    cerrarModalPdf();
  }
});

function animarCambioFiltro() {
  const filtro = document.querySelector(".filtro-todo");

  filtro.classList.remove("animar-cambio");

  void filtro.offsetWidth;

  filtro.classList.add("animar-cambio");
}
</script>
